services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 4000
      MONGO_URL: mongodb://mongo:27017/sentinelx
      PLAYBOOKS_DIR: /app/playbooks
    ports:
      - '4000:4000'
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/health']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  sandbox-mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - sandbox-mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  sandbox-seed:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    environment:
      MONGO_URI: mongodb://sandbox-mongo:27017/vulnapp
    command: ['npx', 'ts-node', '--transpile-only', 'seed.ts']
    depends_on:
      sandbox-mongo:
        condition: service_healthy

  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    restart: unless-stopped
    environment:
      JWT_SECRET: secret123
      MONGO_URI: mongodb://sandbox-mongo:27017/vulnapp
      PORT: 3000
    ports:
      - '3001:3000'
    depends_on:
      sandbox-mongo:
        condition: service_healthy
      sandbox-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo-data:
  sandbox-mongo-data:
