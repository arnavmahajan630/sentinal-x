server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS; resolve `server` lazily so nginx boots even if server is restarting.
  resolver 127.0.0.11 valid=10s;
  set $api http://server:4000;

  location /health {
    proxy_pass $api;
  }

  location /api/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # SSE (C5+/C11): never buffer or time out live agent streams.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }
}
